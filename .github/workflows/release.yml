name: CI and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, leave empty to build the selected ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.release-context.outputs.is_release }}
      tag_name: ${{ steps.release-context.outputs.tag_name }}
      source_ref: ${{ steps.release-context.outputs.source_ref }}
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Resolve release context
        id: release-context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          tag_name=""
          source_ref="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "push" && "$CURRENT_REF" == refs/tags/* ]]; then
            is_release=true
            tag_name="$CURRENT_REF_NAME"
            source_ref="$CURRENT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            git check-ref-format "refs/tags/$DISPATCH_TAG"
            is_release=true
            tag_name="$DISPATCH_TAG"
            source_ref="refs/tags/$DISPATCH_TAG"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        if: steps.release-context.outputs.is_release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-context.outputs.source_ref }}
          fetch-depth: 0

      - name: Validate release version
        id: release-version
        if: steps.release-context.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.release-context.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "howlto") | .version'
          )"
          expected_tag="v$package_version"
          manual_notes="docs/changelog/$package_version.md"

          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            echo "tag $TAG_NAME does not match package version $package_version" >&2
            exit 1
          fi
          if [[ ! -s "$manual_notes" ]]; then
            echo "missing release notes: $manual_notes" >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust
          shared-key: test-ubuntu-24.04

      - name: Run tests
        run: cargo test --locked --all-targets

  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64-gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package_os: linux
            package_arch: x86_64-gnu
            binary_format: ELF
            use_zig: true
          - label: linux-x86_64-musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            package_os: linux
            package_arch: x86_64-musl
            binary_format: ELF
            use_zig: true
          - label: linux-aarch64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_os: linux
            package_arch: aarch64-gnu
            binary_format: ELF
            use_zig: true
          - label: linux-aarch64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            package_os: linux
            package_arch: aarch64-musl
            binary_format: ELF
            use_zig: true
          - label: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            package_os: macos
            package_arch: x86_64
            binary_format: Mach-O
            use_zig: false
          - label: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            package_os: macos
            package_arch: aarch64
            binary_format: Mach-O
            use_zig: false

    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust
          shared-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.use_zig
        run: pip install cargo-zigbuild

      - name: Install Zig
        if: matrix.use_zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build bins with Zig
        if: matrix.use_zig
        run: cargo zigbuild --locked --release --bins --target "${{ matrix.target }}"

      - name: Build bins
        if: ${{ !matrix.use_zig }}
        run: cargo build --locked --release --bins --target "${{ matrix.target }}"

      - name: Sign macOS bins
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --sign - "target/$TARGET/release/howlto"

      - name: Validate binary
        env:
          BINARY_FORMAT: ${{ matrix.binary_format }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/howlto"
          test -x "$binary"
          file "$binary" | grep -q "$BINARY_FORMAT"

          cargo_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "howlto") | .version'
          )"
          expected_version="$(bash scripts/version-info.sh "$cargo_version")"
          actual_version="$("$binary" --version)"
          if [[ "$actual_version" != "howlto $expected_version" ]]; then
            echo "unexpected version output: $actual_version" >&2
            exit 1
          fi

      - name: Package binary
        id: package
        env:
          PACKAGE_ARCH: ${{ matrix.package_arch }}
          PACKAGE_OS: ${{ matrix.package_os }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${VERSION:-}" ]]; then
            export PACKAGE_VERSION="$VERSION"
          fi
          bash scripts/package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: howlto-${{ steps.package.outputs.package_version }}-${{ matrix.package_os }}-${{ matrix.package_arch }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish release
    if: needs.version.outputs.is_release == 'true'
    needs:
      - version
      - test
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: Refetch annotated tag object
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: Validate tag annotation
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG_NAME"
          manual_notes="docs/changelog/$VERSION.md"

          if [[ ! -s "$manual_notes" ]]; then
            echo "missing release notes: $manual_notes" >&2
            exit 1
          fi

          tag_type="$(git cat-file -t "$tag_ref")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "release tag must be annotated: $TAG_NAME" >&2
            exit 1
          fi

          git cat-file tag "$tag_ref" | sed '1,/^$/d' > tag-notes.md
          if ! grep -q '[^[:space:]]' tag-notes.md; then
            echo "tag annotation is empty: $TAG_NAME" >&2
            exit 1
          fi
          if ! cmp -s "$manual_notes" tag-notes.md; then
            echo "tag annotation does not match $manual_notes" >&2
            diff -u "$manual_notes" tag-notes.md || true
            exit 1
          fi

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p staged
          while IFS= read -r -d '' archive; do
            mv "$archive" staged/
          done < <(find release-artifacts -type f -name "howlto-$VERSION-*.tar.gz" -print0)

          cd staged
          archives=(howlto-"$VERSION"-*.tar.gz)

          if (( ${#archives[@]} != 6 )); then
            echo "expected 6 archives, found ${#archives[@]}" >&2
            exit 1
          fi

          sha256sum "${archives[@]}" > SHA256SUMS
          mv SHA256SUMS "${archives[@]}" ../release-artifacts/

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          base_tag_file="docs/changelog/$VERSION-base.txt"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
          )

          target_sha="$(git rev-parse HEAD)"
          api_args+=(-f "target_commitish=$target_sha")

          if [[ -s "$base_tag_file" ]]; then
            base_tag="$(<"$base_tag_file")"
            git check-ref-format "refs/tags/$base_tag"
            api_args+=(-f "previous_tag_name=$base_tag")
          fi

          gh api "${api_args[@]}" --jq '.body' > generated-notes.md
          cp "$manual_notes" release-notes.md
          if [[ -s generated-notes.md ]]; then
            printf '\n---\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-artifacts/howlto-"$VERSION"-*.tar.gz
            release-artifacts/SHA256SUMS
          )

          if (( ${#assets[@]} != 7 )); then
            echo "expected 7 release files, found ${#assets[@]}" >&2
            exit 1
          fi

          prerelease_args=()
          latest_args=(--latest)
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
            latest_args=()
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "howlto v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}" \
              "${latest_args[@]}"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "howlto v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}" \
              "${latest_args[@]}"
          fi
